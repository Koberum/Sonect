name: Docker

on:
  pull_request:
  # Invoked by release.yml after release-please creates a release. A release
  # created with the default GITHUB_TOKEN does not emit a `release: published`
  # event that other workflows can trigger, so the build runs in the same run
  # as release-please instead of on `release.published`.
  workflow_call:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 0.1.2)"
        required: true
        type: string
  # Manual re-trigger to (re)publish images for an existing version.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish, without the leading v (e.g. 0.1.2)"
        required: true
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sonect
            context: .
            file: packages/backend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sonect
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SONECT_VERSION=${{ inputs.version != '' && inputs.version || 'dev' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # PR builds only *build* the image; a runtime regression (e.g. a missing
  # COPY of a bundled asset) would otherwise slip through unnoticed. Build the
  # sonect image for the runner's platform, actually start it (mpd + node under
  # s6-overlay), and fail if it crashes before the HTTP server is ready.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build sonect image (local, amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: sonect:smoke
          build-args: |
            SONECT_VERSION=dev
          cache-from: type=gha,scope=sonect

      - name: Smoke test container startup
        run: |
          set -euo pipefail
          docker run -d --name sonect-smoke -e MPD_HOST=127.0.0.1 sonect:smoke

          ready=0
          for _ in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' sonect-smoke 2>/dev/null | grep -q true; then
              echo "::error::container exited before becoming ready"
              docker logs sonect-smoke || true
              exit 1
            fi
            if docker logs sonect-smoke 2>&1 | grep -q "Backend Express"; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::backend did not become ready in time"
            docker logs sonect-smoke || true
            exit 1
          fi

          if docker logs sonect-smoke 2>&1 | grep -q "Failed to start"; then
            echo "::error::backend failed to start"
            docker logs sonect-smoke || true
            exit 1
          fi

          docker exec sonect-smoke ls /app/drizzle
          echo "smoke test passed"

      - name: Cleanup
        if: always()
        run: docker rm -f sonect-smoke || true
