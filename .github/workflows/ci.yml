name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Bundle backend
        run: pnpm --filter backend bundle

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          VITE_BACKEND_URL: ""
          VITE_COVER_PATH: /covers
          VITE_DEBUG: "false"

      - name: Backend tests
        run: pnpm --filter backend test

  # Compatibility floor: node:sqlite and the bundled backend must work on the
  # oldest Node 22.x we verify (22.14.0). The full suite keeps running on the
  # latest Node 22 in the `ci` job above.
  db-node-22-14-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @repo/types build
          pnpm --filter @repo/db build

      - name: Bundle backend
        run: pnpm --filter backend bundle

      - name: DB tests
        run: >-
          pnpm --filter backend exec mocha --no-config
          --node-option import=tsx/esm --timeout 10000
          src/__tests__/db/connection.test.ts
          src/__tests__/db/schemaMigration.test.ts
          src/__tests__/db/repositories.test.ts
          src/__tests__/db/playTrackingDb.test.ts
