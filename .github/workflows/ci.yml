name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Bundle backend
        run: pnpm --filter backend bundle

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          VITE_BACKEND_URL: ""
          VITE_COVER_PATH: /covers
          VITE_DEBUG: "false"

      - name: Backend tests
        run: pnpm --filter backend test
