<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sonect-favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/sonect-favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonect</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem("vite-ui-theme") || "dark";
          if (mode === "system") {
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (mode === "dark" || mode === "light") root.classList.add(mode);

          var template = localStorage.getItem("sonect.theme.template");
          if (template !== "graphite" && template !== "ocean") {
            template = "sonect";
          }
          root.setAttribute("data-theme", template);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "sonect");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
