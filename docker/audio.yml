# Overlay that grants both containers access to the host audio hardware.
#
# Use it when Sonect should play through a local sound card / USB DAC:
#
#   docker compose -f docker-compose.yml -f audio.yml up -d
#
# It does NOT use `privileged: true` — only the specific devices, the audio
# group and a read-only view of ALSA's proc tree.
#
# On a host without a sound card (e.g. a NAS) leave this overlay out.

services:
  sonect-mpd:
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio

  sonect-app:
    # The backend enumerates playback devices by reading /proc/asound
    # (cards, pcm, per-card usbid); USB vendor/product names are resolved
    # best-effort from /sys/bus/usb/devices when available.
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    volumes:
      - /proc/asound:/proc/asound:ro
      - /dev/bus/usb:/dev/bus/usb
