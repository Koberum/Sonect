# Sonect — single-container deployment (MPD + API + web UI in one image).
#
# Storage is provided by the host as bind mounts: mount the host folder that
# contains your music libraries at /libraries (read-only) and register each
# first-level subfolder in the Sonect UI. Sonect never mounts anything or runs
# privileged commands.
#
#   volumes:
#     - /host/path/to/music:/libraries:ro
#     - sonect-data:/app/data
#
# Audio output is enabled by default. /dev/snd is bind-mounted live, so cards
# and USB DACs plugged in after container start are visible without a restart.
# The device cgroup rule allows ALSA character devices (major 116). On a host
# without sound hardware these settings are harmless.

services:
  sonect:
    image: ghcr.io/koberum/sonect:latest
    container_name: sonect
    restart: unless-stopped
    environment:
      MPD_HOST: 127.0.0.1
      MPD_PORT: "6600"
      MUSIC_DIR: /libraries
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - /host/path/to/music:/libraries:ro
      - sonect-data:/app/data
      - /dev/snd:/dev/snd
    device_cgroup_rules:
      - "c 116:* rwm"
    group_add:
      - audio
    ports:
      - "3000:3000"

volumes:
  sonect-data:
