# Sonect MPD base configuration.
#
# This file is baked into the image and never modified at runtime. All
# user-editable settings (audio outputs, advanced options) live in the
# drop-in below, which the Sonect backend owns.

music_directory     "/libraries"
playlist_directory  "/mpd-state/playlists"
db_file             "/mpd-state/tag_cache"
state_file          "/mpd-state/state"
sticker_file        "/mpd-state/sticker.sql"
log_file            "/mpd-logs/mpd.log"

# Reachable from the sonect-app container over the compose network.
bind_to_address     "0.0.0.0"
port                "6600"

# User-editable settings are managed by the Sonect frontend and written here.
include "/mpd-config/mpd-audio.conf"
