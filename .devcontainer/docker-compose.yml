# Dev-only compose. This builds the devcontainer's own image (not the
# production `ghcr.io/koberum/sonect` image) and starts a single service.
services:
  sonect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonect-dev
    # Kept for reliable ALSA access in dev: unlike the production compose
    # (live /dev/snd bind mount + ALSA device cgroup rule), privileged avoids
    # host-specific device/group mismatches when developing against local
    # audio hardware.
    privileged: true

    volumes:
      - ..:/workspace
      - ../music:/music
      - ../conf/mpd.conf:/etc/mpd.conf
      - ../data:/var/lib/mpd
      - sonect-db:/db
      - /dev/snd:/dev/snd

    ports:
      - "3000:3000" # backend
      - "5173:5173" # frontend (Vite)
      - "6600:6600" # MPD
      - "4983:4983" # Drizzle kit

    command: sleep infinity

volumes:
  mpd-data:
  sonect-db:
